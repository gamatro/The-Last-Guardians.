<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last Guardians</title>
<style>
  :root {
    --bg: #f3f4f6;
    --board: #58b368;
    --border: #cbd0d8;
    --text: #1f2430;
    --player: #e11d2e;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b;
      --board: #2f7a45;
      --border: #3a3f4b;
      --text: #e6e8ee;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161b;
    --board: #2f7a45;
    --border: #3a3f4b;
    --text: #e6e8ee;
  }
  html { color-scheme: light dark; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  canvas {
    background: var(--board);
    border: 2px solid var(--border);
    border-radius: 6px;
    max-width: 94vw;
    height: auto;
    touch-action: none;
  }
  p { margin: 0; font-size: 0.95rem; opacity: 0.8; }
</style>
</head>
<body>
  <canvas id="c" width="480" height="360"></canvas>

<h1>----------------------------------Solo para computador.-------------------------------------                        
  Si un coso te vence varias veces, no es imposible por que sea imposible vencerlo, a veces se distraen</h1>
  
<script>
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const GOLD = "#e3b52b";
  // Mundo 3 veces más grande que la pantalla
  const WORLD = { w: 6000, h: 4500 };
  const ROOM = { w: 300, h: 200 }; // tamaño del interior de los edificios
  const ROADS = [ // caminos entre ciudades; cruzan los ríos por los puentes
    [[350, 275], [1740, 1095]], [[1740, 1095], [3000, 1524], [3940, 1195]], [[3940, 1195], [5140, 395]],
    [[3940, 1195], [4124, 2250], [4040, 3195]], [[1740, 1095], [1924, 2250], [1740, 3195]], [[350, 275], [824, 2250], [390, 3795]],
    [[1740, 3195], [3000, 3224], [4040, 3195]], [[1740, 3195], [390, 3795]], [[4040, 3195], [5355, 3910]],
    [[5140, 395], [5224, 2250], [5355, 3910]], [[390, 3795], [3000, 4024], [5355, 3910]]
  ];
  const ISLANDS = [[2850, 2100, 300, 300]]; // isla en el centro del lago: solo se llega en barco
  const WATER = [[2600, 1850, 800, 800], [2980, 0, 40, 1850], [2980, 2650, 40, 1850], [0, 2230, 2600, 40], [3400, 2230, 2600, 40]]; // lago central y 4 ríos // lago y ríos
  const BRIDGES = [[2970, 500, 60, 48], [2970, 1500, 60, 48], [2970, 3200, 60, 48], [2970, 4000, 60, 48],
    [800, 2220, 48, 60], [1900, 2220, 48, 60], [4100, 2220, 48, 60], [5200, 2220, 48, 60]];
  const CITIES = [
    { name: "Villa Aurora", x: 80, y: 20, w: 540, h: 510 },
    { name: "Puerto Lago", x: 4900, y: 200, w: 480, h: 390 },
    { name: "Monte Roble", x: 150, y: 3600, w: 480, h: 390 },
    { name: "Ciudad Dorada", x: 5100, y: 3700, w: 510, h: 420 },
    { name: "Aldea Brisa", x: 1500, y: 900, w: 480, h: 390 },
    { name: "Valle Escarcha", x: 3700, y: 1000, w: 480, h: 390 },
    { name: "Playa Coral", x: 1500, y: 3000, w: 480, h: 390 },
    { name: "Fuerte Sol", x: 3800, y: 3000, w: 480, h: 390 }
  ];
  const inRect = (x, y, r) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3];
  const BNAMES = [
    ["Gremio de Guardianes", "Aquí se registran los guardianes de todo el mundo."], ["Posada del Alba", "Descansas y recuperas toda la vida."],
    ["Mercado del Puerto", "Aquí se venderán armas y pociones (¡pronto!)."], ["Taberna del Pez", "Huele a pescado frito y a aventuras."],
    ["Herrería Roble", "Aquí se forjan las mejores espadas."], ["Templo del Bosque", "Un lugar tranquilo para pensar."],
    ["Banco Dorado", "Aquí se guarda el dinero."], ["Arena de Batalla", "Aquí los guardianes se retan a duelo."],
    ["Tienda de Armas", "Aquí se venden espadas, hachas y katanas."], ["Cervecería Brisa", "Espuma, risas y canciones."],
    ["Refugio Escarcha", "Una chimenea encendida para los guardianes."], ["Forja de Hielo", "Espadas que nunca se calientan."],
    ["Faro Coral", "Su luz guía a los barcos."], ["Mercado de Mariscos", "Huele a mar y a sal."],
    ["Cuartel del Sol", "Aquí entrenan los guardianes más valientes."], ["Armería Solar", "Armas que brillan como el sol."]
  ];
  const GENERIC = [ // nombres para el resto de los edificios
    ["Casa de la Abuela", "Huele a pan recién hecho."], ["Panadería", "Pan caliente para los guardianes."],
    ["Biblioteca", "Libros sobre cosos de todos los niveles."], ["Herbolario", "Hierbas para curar heridas."],
    ["Establo", "Aquí descansan los caballos."], ["Casa de Té", "Un té tranquilo antes de la batalla."],
    ["Museo de Cosos", "Hay cosos disecados... ¡y uno parpadeó!"], ["Relojería", "Todos los relojes marcan la hora real."],
    ["Zapatería", "Zapatos para caminar por todo el mundo."], ["Casa Vacía", "Nadie vive aquí... o eso parece."],
    ["Taller", "Se oye martillar al fondo."], ["Casa del Pescador", "Redes y anzuelos por todas partes."],
    ["Mercería", "Hilos de todos los colores."], ["Pastelería", "Los pasteles más dulces del mundo."],
    ["Observatorio", "Desde aquí se ven las estrellas."]
  ];
  const OWNERS = "Ana Beto Carla Diego Elena Felipe Gala Hugo Irene Jaime Karla Luis Marta Nico Olga Pablo Rosa Sergio Tania Ugo Vera Wilson Ximena Yago Zoe Aitor Bruno Celia Dario Edna Fidel Gema Hector Ines Joel Kira Leon Mara Noa Omar Paz Quino Rita Saul Tula Uriel Vilma Willy Xavi Yara Zeta Abel Berta Cesar Dalia Elias Flor Gael Hilda Ivan Jana Kevin Lola Mateo Nora Oscar".split(" ");
  const CHARMS = ["una chimenea", "un gato dormido", "plantas por todos lados", "un reloj de cuco", "una mesa con té", "una alfombra tejida"];
  let gi = 0; // cuenta los edificios comunes para que ninguno se repita
  const BUILDINGS = [];
  CITIES.forEach((c, ci) => {
    Array.from({ length: 12 }, (_, n) => [40 + (n % 4) * (c.w - 144) / 3, 50 + Math.floor(n / 4) * (c.h - 160) / 2]).forEach(([dx, dy], i) => { // 4 columnas x 3 filas
      const b = { x: c.x + dx, y: c.y + dy, w: 64, h: 48 };
      if (i < 2) { b.name = BNAMES[ci * 2 + i][0]; b.desc = BNAMES[ci * 2 + i][1]; b.special = true; } // los dos primeros son los importantes de cada ciudad
      else { // los demás también se visitan y ninguno se repite
        const n = gi++;
        if (n < GENERIC.length) { b.name = GENERIC[n][0]; b.desc = GENERIC[n][1]; }
        else if (n === GENERIC.length + 8) { b.name = "Establo"; b.desc = "Otro establo: aquí también se guardan caballos."; } // el único nombre que se repite
        else { const o = OWNERS[(n - GENERIC.length) % OWNERS.length]; b.name = "Casa de " + o; b.desc = "La casa de " + o + ", con " + CHARMS[n % CHARMS.length] + "."; }
      }
      BUILDINGS.push(b);
    });
  });
  const inVilla = (x, y) => inRect(x, y, [CITIES[0].x - 10, CITIES[0].y - 10, CITIES[0].w + 20, CITIES[0].h + 20]);
  BUILDINGS.push({ x: 2900, y: 2130, w: 64, h: 48, name: "Tienda de la Isla", desc: "Una tienda secreta en medio del lago.", special: true, island: true });
  const wet = (x, y) => WATER.some((r) => inRect(x, y, r)) && !BRIDGES.some((r) => inRect(x, y, r)) && !ISLANDS.some((r) => inRect(x, y, r));
  const badPt = (px, py) => (WATER.some((r) => inRect(px, py, r)) && !BRIDGES.some((r) => inRect(px, py, r)) && !ISLANDS.some((r) => inRect(px, py, r))) ||
    BUILDINGS.some((b) => inRect(px, py, [b.x, b.y, b.w, b.h]));
  const blocked = (x, y) => badPt(x + 8, y + 40) || badPt(x + 32, y + 40); // los dos pies deben pisar tierra o puente
  function freePos(x, y) { // si alguien queda en el agua o en un edificio, lo saca a tierra firme
    if (!blocked(x, y)) return [x, y];
    for (let r = 10; r <= 600; r += 10) {
      for (let a = 0; a < 16; a++) {
        const nx = x + Math.cos(a * Math.PI / 8) * r, ny = y + Math.sin(a * Math.PI / 8) * r;
        if (nx >= 0 && ny >= 0 && nx <= WORLD.w - 40 && ny <= WORLD.h - 60 && !blocked(nx, ny)) return [nx, ny];
      }
    }
    return [x, y];
  }
  const cityAt = (x, y) => CITIES.find((c) => inRect(x, y, [c.x, c.y, c.w, c.h]));

  // Dos personajes iguales con tres diferencias: color del cuerpo, gema y kanji derecho
  const players = [
    {
      x: 150, y: 170, size: 40, speed: 240,
      controls: { left: "ArrowLeft", right: "ArrowRight", up: "ArrowUp", down: "ArrowDown" },
      color: "#e11d2e",
      gem: { main: "#2f86e8", light: "#8cc8ff", edge: "#14508a" },
      kanji: "赤", // rojo
      sword: { handle: "#1f4fd1", edge: "#102a78", gem: "#35a2ff", light: "#a9dcff", gemEdge: "#0e3f8a" }, // mango azul
      facing: 1, // 1 = espada a la derecha, -1 = a la izquierda
      idle: { x: 1, y: -1 }, // quieto, mira al noreste
      look: { x: 1, y: -1 }
    },
    {
      x: 290, y: 170, size: 40, speed: 240,
      controls: { left: "a", right: "d", up: "w", down: "s" },
      color: "#2563eb",
      gem: { main: "#e03535", light: "#ff9a9a", edge: "#8a1414" },
      kanji: "青", // azul
      idle: { x: -1, y: -1 }, // quieto, mira al noroeste
      sword: { handle: "#d32f2f", edge: "#7a1212", gem: "#ff4d4d", light: "#ffb3b3", gemEdge: "#8a1414" }, // mango rojo
      facing: -1,
      look: { x: -1, y: -1 }
    },
    {
      x: 220, y: 60, size: 40, speed: 240, // en medio de los otros dos y más arriba
      controls: { left: "j", right: "l", up: "i", down: "k" },
      color: "#8a8f98",
      gem: { main: "#2fb458", light: "#8ee6a8", edge: "#14693a" },
      kanji: "灰", // gris
      idle: { x: 0, y: 1 }, // quieto, mira hacia abajo
      sword: { handle: "#2fa84f", edge: "#145a2a", gem: "#3fd16a", light: "#aef0c3", gemEdge: "#14693a" }, // mango verde
      facing: 1,
      look: { x: 0, y: 1 }
    }
  ];

  // Vida de cada personaje (por ahora siempre llena)
  // ---- Nivel, experiencia, dinero y combate por turnos ----
  const WIN_KILLS = 30; // cosos que debe vencer cada guardián sin perder
  let notice = { text: "", t: 0 }, banner = { text: "", t: 0 }, paused = false, showMap = false;
  let slot = "1", dreamFx = 0, dreamer = null, showRadar = false, showInfo = false, idleT = 0, shiftDown = false, shiftUsed = false, peaceMode = false;
  const gkey = (q) => "guardianes:" + slot + ":" + q.id; // la partida depende del modo elegido en el menú
  const NAMES = ["Rojo", "Azul", "Gris"], ATK_KEYS = ["Enter", "e", "p"], CANCEL_KEYS = ["Escape", "c", "m"], CAP_KEYS = [",", "x", "o"]; // CAP_KEYS: atrapar coso
  const xpNeeded = (lv) => 100 + 50 * (lv - 5); // cada nivel cuesta más que el anterior
  function setStats(p) { p.maxHp = 80 + p.level * 4; }
  function gainXp(p, n) {
    p.xp += n;
    while (p.xp >= xpNeeded(p.level)) { p.xp -= xpNeeded(p.level); p.level++; setStats(p); notice = { text: "¡" + p.name + " subió a nivel " + p.level + "!", t: 3.5 }; sfx("up"); }
  }
  players.forEach((p, i) => {
    p.name = "Guardián " + NAMES[i]; p.defName = p.name; p.id = NAMES[i]; p.atkKey = ATK_KEYS[i];
    p.sx0 = p.x; p.sy0 = p.y; // dónde empezó (aquí reaparece si muere)
    p.level = 5; p.xp = 0; p.money = 500; p.hidden = false;
    p.form = 1; p.weapons = 0; p.evo = null; p.noEvoBefore = 0; p.cancelKey = CANCEL_KEYS[i]; p.kills = 0; p.capKey = CAP_KEYS[i]; p.bags = 0; p.pets = []; // varias mascotas
    p.potions = 0; p.hypers = 0; p.gun = 0; p.horse = false; p.potKey = ["v", "g", "t"][i]; p.hypKey = ["n", "h", "y"][i];
    setStats(p); p.hp = p.maxHp;
  });

  // Espada como segmento (pomo → punta) en coordenadas del juego
  function swordSeg(p) {
    const sx = p.facing > 0 ? p.x + p.size + 13 : p.x - 13, sy = p.y + 14;
    const cx = sx, cy = sy + 22, a = 0.25 * p.facing, c = Math.cos(a), s = Math.sin(a);
    const rot = (x, y) => [cx + (x - cx) * c - (y - cy) * s, cy + (x - cx) * s + (y - cy) * c];
    return [...rot(sx, sy + 34), ...rot(sx, sy - (p.form > 1 ? 34 : 27))];
  }
  function ptSeg(px, py, g) {
    const dx = g[2] - g[0], dy = g[3] - g[1];
    const t = Math.max(0, Math.min(1, ((px - g[0]) * dx + (py - g[1]) * dy) / (dx * dx + dy * dy)));
    return Math.hypot(px - g[0] - t * dx, py - g[1] - t * dy);
  }
  function swordsTouch(a, b) {
    const s = swordSeg(a), t = swordSeg(b);
    const o = (ax, ay, bx, by, cx, cy) => Math.sign((bx - ax) * (cy - ay) - (by - ay) * (cx - ax));
    const cross = o(s[0], s[1], s[2], s[3], t[0], t[1]) !== o(s[0], s[1], s[2], s[3], t[2], t[3]) &&
                  o(t[0], t[1], t[2], t[3], s[0], s[1]) !== o(t[0], t[1], t[2], t[3], s[2], s[3]);
    const near = Math.min(ptSeg(s[0], s[1], t), ptSeg(s[2], s[3], t), ptSeg(t[0], t[1], s), ptSeg(t[2], t[3], s));
    return cross || near < 6;
  }

  // ---- Sonido y música (se activan con la primera tecla) ----
  let AC = null, musicStep = 0, musicTick = 0, musicMuteUntil = 0, lastMusic = null;
  function audio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === "suspended") AC.resume();
  }
  function blip(f0, f1, dur, type, vol, delay) {
    if (!AC) return;
    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
    return { g };
  }
  function sfx(kind) {
    if (!started) return; // en la pantalla de inicio no suena nada
    if (AC && (kind === "up" || kind === "save" || kind === "load")) { // solo con estos se calla la música; con los de batalla sigue
      const quiet = { clash: 0.3, cut: 0.5, monster: 0.45, up: 0.55, save: 0.5, load: 0.75 }[kind] || 0.4;
      musicMuteUntil = Math.max(musicMuteUntil, AC.currentTime + quiet);
      if (lastMusic) { lastMusic.g.gain.cancelScheduledValues(AC.currentTime); lastMusic.g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.02); }
    }
    if (kind === "clash") { blip(2400, 1600, 0.2, "square", 0.04); blip(3300, 2100, 0.14, "triangle", 0.04, 0.02); } // espadas
    else if (kind === "cut") { blip(1500, 200, 0.15, "sawtooth", 0.05); blip(1000, 450, 0.3, "sawtooth", 0.05, 0.12); } // cortada + chillido del coso
    else if (kind === "monster") { blip(200, 90, 0.2, "square", 0.06); blip(260, 110, 0.22, "square", 0.06, 0.16); } // el coso ataca
    else if (kind === "up") { [523, 659, 784].forEach((f, i) => blip(f, f, 0.18, "triangle", 0.06, i * 0.12)); }
    else if (kind === "save") { blip(660, 660, 0.12, "triangle", 0.18); blip(880, 880, 0.12, "triangle", 0.18, 0.1); blip(1320, 1320, 0.25, "triangle", 0.18, 0.2); } // campanita al guardar
    else if (kind === "load") { blip(1000, 250, 0.4, "sawtooth", 0.1); blip(330, 330, 0.15, "square", 0.1, 0.4); blip(440, 440, 0.2, "square", 0.1, 0.52); } // "rebobinar" al reiniciar
  }
  const SONGS = {
    day:    { every: 2, type: "triangle", notes: [262, 330, 392, 330, 294, 349, 440, 349] },
    night:  { every: 3, type: "sine",     notes: [220, 262, 330, 262, 196, 247, 294, 247] },
    battle: { every: 1, type: "sawtooth", notes: [196, 196, 233, 196, 262, 233, 294, 262] },
    "Villa Aurora":  { every: 2, type: "triangle", notes: [262, 330, 392, 523, 392, 330, 294, 349] },
    "Puerto Lago":   { every: 3, type: "sine",     notes: [294, 370, 440, 370, 330, 415, 494, 415] },
    "Monte Roble":   { every: 2, type: "triangle", notes: [220, 262, 294, 330, 294, 262, 247, 262] },
    "Ciudad Dorada": { every: 1, type: "triangle", notes: [392, 494, 587, 494, 440, 523, 659, 523] },
    "Aldea Brisa":    { every: 3, type: "sine",     notes: [330, 392, 494, 392, 349, 440, 523, 440] },
    "Valle Escarcha": { every: 3, type: "sine",     notes: [247, 294, 370, 294, 262, 330, 392, 330] },
    "Playa Coral":    { every: 2, type: "triangle", notes: [349, 440, 523, 440, 392, 494, 587, 494] },
    "Fuerte Sol":     { every: 1, type: "triangle", notes: [330, 330, 392, 440, 392, 330, 294, 330] }
  };
  setInterval(() => { // una melodía para el día, otra para la noche (desde las 5 p. m.) y otra para la batalla
    if (!AC || AC.state !== "running" || paused || !started || AC.currentTime < musicMuteUntil) return;
    const cq = players.find((q) => !q.hidden && q.city); // la canción cambia según la ciudad donde estés
    const song = SONGS[battle ? "battle" : cq ? cq.city.name : isNight() ? "night" : "day"] || SONGS.day; // si una ciudad no tiene canción, suena la de día
    if (++musicTick % song.every) return;
    const f = song.notes[musicStep++ % song.notes.length];
    lastMusic = blip(f, f, song.every * 0.22, song.type, 0.4);
  }, 140);

  // ---- Guardar partida: / rojo, Q azul, U gris ----
  function savePlayer(q) {
    try {
      localStorage.setItem(gkey(q), JSON.stringify({ name: q.name, level: q.level, xp: q.xp, money: q.money, weapons: q.weapons, form: q.form, kills: q.kills, x: q.x, y: q.y,
        inside: BUILDINGS.indexOf(q.inside), ix: q.ix, iy: q.iy, facing: q.facing, hp: q.hp, bags: q.bags, potions: q.potions, hypers: q.hypers, gun: q.gun, pets: q.pets.map((t) => ({ level: t.level, maxHp: t.maxHp, bagT: t.bagT })) }));
      notice = { text: "Partida de " + q.name + " guardada", t: 2.5 }; sfx("save");
    } catch (e) { notice = { text: "No se pudo guardar", t: 2.5 }; }
  }
  // Sin partida guardada (o tras reiniciar/nueva partida/morir) los guardianes aparecen dentro del Gremio de Guardianes
  const GREMIO_SLOTS = [28, 228, 135]; // rojo a la izquierda, gris en medio, azul a la derecha
  function placeAtGremio(q) {
    const g = BUILDINGS.find((b) => b.name === "Gremio de Guardianes");
    q.inside = g; q.x = g.x + 12; q.y = g.y + 24; // por si sale: junto a la puerta
    q.ix = GREMIO_SLOTS[NAMES.indexOf(q.id)]; q.iy = 50;
    q.facing = q.idle.x < 0 ? -1 : 1; q.enterCd = 1.2;
  }
  function respawnAtSave(q) {
    let d = null; try { d = JSON.parse(localStorage.getItem(gkey(q))); } catch (e) {}
    if (!d) { placeAtGremio(q); return; }
    q.x = d.x; q.y = d.y; q.inside = d.inside >= 0 ? BUILDINGS[d.inside] : null; q.ix = d.ix; q.iy = d.iy; q.enterCd = 1.2;
  }
  function loadPlayer(q) {
    try {
      const d = JSON.parse(localStorage.getItem(gkey(q)));
      if (!d) placeAtGremio(q);
      if (d) { Object.assign(q, d); q.inside = d.inside >= 0 ? BUILDINGS[d.inside] : null; (q.pets || (q.pets = [])).forEach((t) => { t.x = q.x; t.y = q.y; }); setStats(q); q.hp = d.hp > 0 ? Math.min(d.hp, q.maxHp) : q.maxHp; }
    } catch (e) { placeAtGremio(q); }
  }
  // Vuelve al último guardado; si nunca guardó, vuelve al inicio (nivel 5, 500 JD, donde empezó)
  function restorePlayer(q) {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(gkey(q))); } catch (e) {}
    if (d) delete d.name; // el nombre solo se cambia al inicio
    Object.assign(q, d || { level: 5, xp: 0, money: 500, weapons: 0, form: 1, kills: 0, bags: 0, pets: [], potions: 0, hypers: 0, gun: 0, x: q.sx0, y: q.sy0, inside: -1 });

  // El reloj lee siempre la hora real del dispositivo, así que sigue aunque el juego esté en pausa (Alt) y no se descuadra

  const keys = {};
  window.addEventListener("keydown", (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (!started) { menuKey(e, k); return; }
    // Shift + tecla "/" (por su posición física, así no choca con guardar en teclados donde "/" lleva Shift)
    if (e.shiftKey && (e.code === "Slash" || e.code === "NumpadDivide")) { e.preventDefault(); shiftUsed = true; if (!e.repeat) newGameCombo(); return; }
    // R + . : volver al inicio (mantén R y pulsa .)
    if (!e.repeat && ((k === "." && keys.r) || (k === "r" && keys["."]))) { goMenu(); return; }
    if (e.key === "Shift") { if (!e.repeat) { shiftDown = true; shiftUsed = false; } return; } // Shift solo (sin otra tecla): mapa
    if (e.key === "Alt") { e.preventDefault(); if (!e.repeat) paused = !paused; idleT = 0; return; } // Alt: pausa / seguir
    audio();
    if (shiftDown) shiftUsed = true;
    keys[k] = true;
    if (e.key.startsWith("Arrow") || e.key === "Enter" || e.key === "/") e.preventDefault();
    if (!e.repeat) onKey(k);
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (e.key === "Shift") { if (shiftDown && !shiftUsed) showMap = !showMap; shiftDown = false; return; }
    keys[k] = false;
  });

  function update(p, dt) {
    if (p.inside) { // dentro de un edificio: camina por la sala y sal por la puerta de abajo
      const k0 = p.controls;
      const dx = (keys[k0.right] ? 1 : 0) - (keys[k0.left] ? 1 : 0), dy = (keys[k0.down] ? 1 : 0) - (keys[k0.up] ? 1 : 0);
      if (dx && p.sword) p.facing = dx;
      p.ix = Math.max(14, Math.min(ROOM.w - 54, p.ix + dx * p.speed * dt));
      p.iy = Math.max(44, Math.min(ROOM.h - 52, p.iy + dy * p.speed * dt));
      const tx = (dx || dy) ? dx : (p.idle.x ? p.facing : 0), ty = (dx || dy) ? dy : p.idle.y, len = Math.hypot(tx, ty) || 1;
      p.look.x = tx / len; p.look.y = ty / len;
      if (dy > 0 && p.iy >= ROOM.h - 52 && Math.abs(p.ix + 20 - ROOM.w / 2) < 30) { // sale por la puerta
        const b = p.inside; p.inside = null; p.x = b.x + 12; p.y = b.y + 24; p.enterCd = 1.2;
      }
      return;
    }
    if (blocked(p.x, p.y)) [p.x, p.y] = freePos(p.x, p.y); // nunca se queda atascado en el agua
    const c = p.controls;
    const dx = (keys[c.right] ? 1 : 0) - (keys[c.left] ? 1 : 0);
    const dy = (keys[c.down] ? 1 : 0) - (keys[c.up] ? 1 : 0);
    const sp = p.speed * (p.horse ? 1.8 : 1); // el caballo corre más
    const nx = p.x + dx * sp * dt, ny = p.y + dy * sp * dt;
    if (!blocked(nx, p.y)) p.x = nx; // el agua no se cruza, solo por los puentes
    if (!blocked(p.x, ny)) p.y = ny;

    // En movimiento miran hacia donde van; quietos, hacia su dirección de reposo
    if (p.sword && dx) p.facing = dx; // al ir a un lado, la espada y los ojos cambian a ese lado
    const tx = (dx || dy) ? dx : (p.idle.x ? p.facing : 0);
    const ty = (dx || dy) ? dy : p.idle.y;
    const len = Math.hypot(tx, ty);
    p.look.x = tx / len;
    p.look.y = ty / len;

    // Mantener dentro del área de juego
    const marginL = p.sword && p.facing < 0 ? 34 : 13;
    const marginR = p.sword && p.facing > 0 ? 34 : 13;
    p.x = Math.max(marginL, Math.min(WORLD.w - p.size - marginR, p.x));
    p.y = Math.max(56, Math.min(WORLD.h - p.size - 44, p.y));
  }

  function drawCharacter(p) {
    const bx = p.x, by = p.y, bs = p.size, r = 4, tip = 12;
    const bh = bs + 8; // alto del cuerpo: un poco más largo que ancho
    if (p.horse && !p.peace) drawHorse(bx, by + bh, p.facing);

    // Sombra en el suelo, justo donde apunta el triángulo
    ctx.save();
    ctx.translate(bx + bs / 2, by + bh + tip + 14);
    ctx.scale(1, 0.3);
    const sh = ctx.createRadialGradient(0, 0, 0, 0, 0, 26);
    sh.addColorStop(0, "rgba(0, 0, 0, 0.5)");
    sh.addColorStop(0.6, "rgba(0, 0, 0, 0.25)");
    sh.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = sh;
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // La espada va pegada al cuerpo, por detrás del rectángulo lateral
    if (p.sword && !p.peace) drawSword(p.facing > 0 ? bx + bs + 13 : bx - 13, by + 14, p.facing, p.sword, p.form);

    // Cuerpo: esquinas suaves y un triángulo hacia abajo
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(bx + r, by);
    ctx.lineTo(bx + bs - r, by);
    ctx.arcTo(bx + bs, by, bx + bs, by + r, r);
    ctx.lineTo(bx + bs, by + bh);
    ctx.arcTo(bx + bs / 2, by + bh + tip, bx, by + bh, 5);
    ctx.lineTo(bx, by + bh);
    ctx.lineTo(bx, by + r);
    ctx.arcTo(bx, by, bx + r, by, r);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.stroke();

    if (!p.peace) { // (sin casco, rectángulos ni kanji en modo paz)
    // Casco: rectángulo dorado (más grande en la forma 3)
    const f3 = p.form === 3;
    ctx.fillStyle = GOLD;
    ctx.fillRect(bx - 3 - (f3 ? 2 : 0), by - 8 - (f3 ? 3 : 0), bs + 6 + (f3 ? 4 : 0), 11 + (f3 ? 3 : 0));
    // Triángulo encima del casco
    ctx.beginPath();
    ctx.moveTo(bx + bs / 2 - 14, by - 8);
    ctx.lineTo(bx + bs / 2, by - (f3 ? 23 : 20));
    ctx.lineTo(bx + bs / 2 + 14, by - 8);
    ctx.closePath();
    ctx.fill();

    // Gema entre el triángulo y el rectángulo
    const gx = bx + bs / 2, gy = by - 8 - (f3 ? 3 : 0);
    ctx.save();
    if (f3) { ctx.translate(gx, gy); ctx.scale(1.7, 1.7); ctx.translate(-gx, -gy); }
    ctx.fillStyle = p.gem.main;
    ctx.beginPath();
    ctx.moveTo(gx, gy - 7);
    ctx.lineTo(gx + 6, gy);
    ctx.lineTo(gx, gy + 7);
    ctx.lineTo(gx - 6, gy);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = p.gem.light;
    ctx.beginPath();
    ctx.moveTo(gx, gy - 7);
    ctx.lineTo(gx - 6, gy);
    ctx.lineTo(gx, gy + 7);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = p.gem.edge;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(gx, gy - 7);
    ctx.lineTo(gx + 6, gy);
    ctx.lineTo(gx, gy + 7);
    ctx.lineTo(gx - 6, gy);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // Rectángulos dorados a los lados de la cara
    ctx.fillStyle = GOLD;
    const rh = p.form > 1 ? 44 : 36; // más altos para que quepa “forma”
    ctx.fillRect(bx - 11, by + 3, 12, rh);
    ctx.fillRect(bx + bs - 1, by + 3, 12, rh);
    // Triángulos encima de cada rectángulo lateral
    ctx.beginPath();
    ctx.moveTo(bx - 11, by + 3);
    ctx.lineTo(bx - 5, by - 9);
    ctx.lineTo(bx + 1, by + 3);
    ctx.closePath();
    ctx.moveTo(bx + bs - 1, by + 3);
    ctx.lineTo(bx + bs + 5, by - 9);
    ctx.lineTo(bx + bs + 11, by + 3);
    ctx.closePath();
    ctx.fill();

    // Texto vertical en japonés: izquierda “guardián”, derecha el color
    ctx.fillStyle = "#4a3200";
    ctx.font = "bold 10px 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ["守", "護", "者"].forEach((ch, i) => ctx.fillText(ch, bx - 5, by + 9 + (rh - 36) / 2 + i * 12));
    if (p.form === 1) ctx.fillText(p.kanji, bx + bs + 5, by + 21);
    else [p.kanji, "形", "態", String(p.form)].forEach((ch, i) => ctx.fillText(ch, bx + bs + 5, by + 9 + i * 11)); // color + “forma 2/3”

    }
    // Ojos: blancos con pupila que mira hacia donde se mueve
    for (const ex of [0.3, 0.7]) {
      const cx = bx + bs * ex;
      const cy = by + bs * 0.38 + 5;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#111111";
      ctx.beginPath();
      ctx.arc(cx + p.look.x * 3, cy + p.look.y * 3, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Cejas y boca: enojado en combate; sonriente en paz
    ctx.strokeStyle = "#111111"; ctx.lineCap = "round";
    if (!p.peace && !happyMode) {
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(bx + 4, by + 10); ctx.lineTo(bx + 18, by + 16);
      ctx.moveTo(bx + 36, by + 10); ctx.lineTo(bx + 22, by + 16);
      ctx.stroke();
    }
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (p.peace || happyMode) ctx.arc(bx + bs / 2, by + bs * 0.58 + 5, 8, Math.PI * 0.15, Math.PI * 0.85);
    else ctx.arc(bx + bs / 2, by + bs * 0.95 + 5, 8, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    if (!p.peace) drawHealthBar(bx + bs / 2, by - 36, p.hp / p.maxHp);
    ctx.save(); ctx.font = "bold 11px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "bottom"; // el nombre, encima de cada guardián
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0, 0, 0, 0.7)"; ctx.strokeText(p.name, bx + bs / 2, by - 40);
    ctx.fillStyle = "#fff"; ctx.fillText(p.name, bx + bs / 2, by - 40); ctx.restore();
  }

  // Barra de vida encima del personaje (cx = centro, y = borde de arriba)
  function drawHealthBar(cx, y, ratio) {
    const w = 48, h = 7, x = cx - w / 2;
    ratio = Math.max(0, Math.min(1, ratio));
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(x - 1.5, y - 1.5, w + 3, h + 3);
    ctx.fillStyle = ratio > 0.5 ? "#3fd16a" : ratio > 0.25 ? "#f2c230" : "#e5412d";
    ctx.fillRect(x, y, w * ratio, h);
    ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
    ctx.fillRect(x, y, w * ratio, 2);
  }

  // Espada vertical con mango azul y gemas azules (sx = centro, sy = arriba del personaje)
  function drawSword(sx, sy, dir, c, form) {
    // Inclinada hacia afuera, girando alrededor del mango
    ctx.save();
    ctx.translate(sx, sy + 22);
    ctx.rotate(0.25 * dir);
    ctx.translate(-sx, -(sy + 22));
    ctx.lineJoin = "round";
    ctx.lineWidth = 1.5;
    // Hoja plateada
    ctx.fillStyle = "#cfd6df";
    ctx.strokeStyle = "#7b8594";
    ctx.beginPath();
    if (form > 1) { // katana: hoja larga, fina y curva
      ctx.moveTo(sx - 2.5, sy + 10);
      ctx.quadraticCurveTo(sx - 2.5, sy - 16, sx + 3, sy - 34);
      ctx.quadraticCurveTo(sx + 4.5, sy - 14, sx + 2.5, sy + 10);
    } else {
      ctx.moveTo(sx - 3.5, sy + 10);
      ctx.lineTo(sx - 3.5, sy - 18);
      ctx.lineTo(sx, sy - 27);
      ctx.lineTo(sx + 3.5, sy - 18);
      ctx.lineTo(sx + 3.5, sy + 10);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "#f4f7fb";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sx, sy + 8);
    ctx.lineTo(sx, sy - 18);
    ctx.stroke();
    // Mango azul
    ctx.fillStyle = c.handle;
    ctx.strokeStyle = c.edge;
    ctx.lineWidth = 1.5;
    ctx.fillRect(sx - 3, sy + 14, 6, 17);
    ctx.strokeRect(sx - 3, sy + 14, 6, 17);
    // Guarda azul
    const gw = form > 1 ? 7 : 10; // la katana tiene guarda más pequeña
    ctx.fillRect(sx - gw, sy + 10, gw * 2, 5);
    ctx.strokeRect(sx - gw, sy + 10, gw * 2, 5);
    // Gemas azules: centro de la guarda, extremos y pomo
    const gems = form > 1 ? [[sx, sy + 12.5, 4.5], [sx, sy + 34, 4]] : [[sx, sy + 12.5, 4.5], [sx - 7.5, sy + 12.5, 2.2], [sx + 7.5, sy + 12.5, 2.2], [sx, sy + 34, 4]];
    for (const [gx2, gy2, gr] of gems) {
      ctx.fillStyle = c.gem;
      ctx.beginPath();
      ctx.moveTo(gx2, gy2 - gr);
      ctx.lineTo(gx2 + gr, gy2);
      ctx.lineTo(gx2, gy2 + gr);
      ctx.lineTo(gx2 - gr, gy2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = c.light;
      ctx.beginPath();
      ctx.moveTo(gx2, gy2 - gr);
      ctx.lineTo(gx2 - gr, gy2);
      ctx.lineTo(gx2, gy2 + gr);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = c.gemEdge;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(gx2, gy2 - gr);
      ctx.lineTo(gx2 + gr, gy2);
      ctx.lineTo(gx2, gy2 + gr);
      ctx.lineTo(gx2 - gr, gy2);
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  }

  let last = performance.now();
  function loop(now) {
    if (!started) { drawMenu(); last = now; requestAnimationFrame(loop); return; }
    const dt = paused ? 0 : Math.min((now - last) / 1000, 0.05);
    notice.t -= dt; banner.t -= dt; dreamFx = Math.max(0, dreamFx - dt);
    idleT = Object.values(keys).some(Boolean) ? 0 : idleT + dt; // 1 minuto sin tocar nada = pausa
    if (idleT > 60 && !paused) { paused = true; idleT = 0; }
    last = now;
    if (battle) {
      for (const q of players) if (q !== battle.a && q !== battle.b && !q.hidden) { update(q, dt); tickEvolution(q, dt); } // los demás siguen jugando
      if (battle.over) { if ((battle.timer -= dt) <= 0) endBattle(); }
      else {
        const att = battle.turn ? battle.b : battle.a, def = battle.turn ? battle.a : battle.b;
        if (att.isMonster) { if ((battle.wait -= dt) <= 0) doAttack(att, def); } // el coso ataca solo en su turno
        else if (def.isMonster && (battle.idle -= dt) <= 0) {
          if (att.pets.some((t) => t.bagT <= 0)) { // tu coso mascota pelea por ti y el coso no te pega
            doAttack(att, def);
            if (!battle.over) { battle.turn ^= 1; battle.msg = "Tu coso mascota ataca por ti. " + battle.msg; }
          } else { // si no atacas a tiempo, el coso aprovecha
            battle.turn = 1; doAttack(def, att);
            if (!battle.over) battle.msg = "¡Te distrajiste! " + battle.msg;
          }
        }
      }
    } else {
      for (const q of players) {
        if (!showMap) update(q, dt); // mirando el mapa no se puede caminar
        tickEvolution(q, dt); petTick(q, dt); horseTick(q);
        const c = cityAt(q.x + 20, q.y + 24);
        if (c !== q.city) { q.city = c; if (c && !q.inside) banner = { text: c.name, t: 3 }; } // título al llegar a una ciudad
        q.enterCd = (q.enterCd || 0) - dt;
        if (!q.inside && q.enterCd <= 0) { // entrar por la puerta de un edificio con nombre
          const b = BUILDINGS.find((z) => z.name && inRect(q.x + 20, q.y + 40, [z.x + 22, z.y + z.h, 20, 14]));
          if (b) { q.inside = b; q.ix = ROOM.w / 2 - 20; q.iy = ROOM.h - 100; banner = { text: "Entraste a " + b.name, t: 3 }; if (b.name === "Posada del Alba") posadaStay(q); }
        }
      }
      updateMonsters(dt);
      updateNpcs(dt);
      cooldown -= dt;
      if (cooldown <= 0) { const f = findBattle(); if (f) startBattle(f[0], f[1]); }
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Después de las 6 p. m. el fondo (y la página) se oscurecen; los personajes no
    const night = isNight();
    document.body.style.background = night ? "#0b0f1a" : "";
    document.body.style.color = night ? "#e6e8ee" : "";
    drawViews(night);
    drawHud();
    if (showMap) drawMap();
    if (showInfo) drawHelp();
    drawBanner();
    drawDream();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
